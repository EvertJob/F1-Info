<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <pattern id="checker" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="12" height="12" fill="#2C2C2C"/>
      <rect x="12" y="12" width="12" height="12" fill="#2C2C2C"/>
      <rect x="12" y="0" width="12" height="12" fill="#EAEAEA"/>
      <rect x="0" y="12" width="12" height="12" fill="#EAEAEA"/>
    </pattern>

    <clipPath id="flagShape">
      <path d="M 15 50 C 65 10, 135 90, 185 50 L 185 130 C 135 170, 65 90, 15 130 Z"/>
    </clipPath>

    <clipPath id="rightHalf">
      <rect x="100" y="0" width="100" height="180"/>
    </clipPath>

    <g id="sunBase">
      <g stroke-width="6" stroke-linecap="round">
        <line x1="100" y1="42" x2="100" y2="30" /> <line x1="134" y1="56" x2="142" y2="48" /> <line x1="148" y1="90" x2="160" y2="90" /> <line x1="134" y1="124" x2="142" y2="132" /> <line x1="100" y1="138" x2="100" y2="150" /> <line x1="66" y1="124" x2="58" y2="132" /> <line x1="52" y1="90" x2="40" y2="90" /> <line x1="66" y1="56" x2="58" y2="48" /> </g>
      <circle cx="100" cy="90" r="36"/>
    </g>

    <path id="glassesBase" d="M 73 87 L 127 87 C 130 87 132 89 132 91 L 128 102 C 124 105 119 105 115 102 L 107 94 L 93 94 L 85 102 C 81 105 76 105 73 102 L 68 91 C 68 89 70 87 73 87 Z"/>
  </defs>

  <path d="M 15 50 C 65 10, 135 90, 185 50 L 185 130 C 135 170, 65 90, 15 130 Z" fill="none" stroke="#EAEAEA" stroke-width="2"/>

  <g clip-path="url(#flagShape)">
    <rect x="0" y="0" width="200" height="180" fill="url(#checker)"/>

    <use href="#sunBase" fill="#F4CD58" stroke="#F4CD58"/>
    <use href="#glassesBase" fill="#354E5A"/>

    <g clip-path="url(#rightHalf)">
      <use href="#sunBase" fill="#E0AD38" stroke="#E0AD38"/>
      <use href="#glassesBase" fill="#21353E"/>
    </g>
  </g>
</svg>