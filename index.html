<!DOCTYPE html>
<html>
<head>
  <!-- Eerst oude service workers + Cache Storage legen (mobiel houdt anders oude main.dart.js vast). -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>
  <!-- Dynamische base href: / voor f1hub.app (custom domain), /F1-Info/ voor GitHub Pages project site -->
  <script>
    (function(){
      var path = window.location.pathname;
      var base = path.startsWith('/F1-Info') ? '/F1-Info/' : '/';
      var el = document.createElement('base');
      el.href = base;
      document.head.insertBefore(el, document.head.firstChild);
    })();
  </script>
  <base href="/">

  <!-- Anti-cache meta tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="F1 Hub — calendars, results, standings, and live timing.">
  <meta name="theme-color" content="#E10600">

  <!-- iOS meta tags & icons (paths relative to web/; match manifest.json) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="F1 Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (regenerated with flutter_launcher_icons) -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>F1 Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=1.0.2+18" async></script>
</body>
</html>
