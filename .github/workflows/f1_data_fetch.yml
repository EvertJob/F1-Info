name: F1 Data Fetcher & Deploy

on:
  schedule:
    - cron: '0 * * * 5,6,0'
  workflow_dispatch:

# Geef de Action schrijfrechten om de web-build te kunnen pushen
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Haal de volledige geschiedenis op voor een schone push

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Fetch Script
        run: dart fetch_session_data.dart

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated F1 data update" || echo "No changes to commit"
          git push

      # --- NIEUWE STAPPEN VOOR DEPLOYMENT ---

      - name: Build Flutter Web
        # Vervang 'F1-Info' door je exacte repository naam als deze anders is
        run: flutter build web --release --base-href "/F1-Info/"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages # De branch waar je website op draait
          clean: true # Verwijder oude bestanden in de target branch
