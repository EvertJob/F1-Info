name: FIA Technical Data Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# DIT VERWIJDERT DE NODE.JS WAARSCHUWING
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync_pu_elements:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          # We wijzen expliciet naar jouw bestand in de scripts map:
          cache-dependency-path: 'scripts/requirements-fia-sync.txt'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements-fia-sync.txt

      - name: Run FIA Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIA_PU_DELETE_BEFORE_INSERT: "1"
        # We voegen 'python -u' toe voor unbuffered logging, zodat we direct zien waar het misgaat
        run: python -u scripts/sync_fia_data.py