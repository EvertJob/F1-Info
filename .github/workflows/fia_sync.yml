name: FIA Technical Data Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

env:
  # Los de Node.js 24 waarschuwing op voor de toekomst
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync_pu_elements:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # We wijzen expliciet naar jouw bestand in de scripts map:
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements-fia-sync.txt'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements-fia-sync.txt

      - name: Run FIA Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIA_PU_DELETE_BEFORE_INSERT: "1"
        # Zorg dat we het script aanroepen vanuit de juiste map
        run: python scripts/sync_fia_data.py