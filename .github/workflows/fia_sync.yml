name: FIA Technical Data Sync

on:
  schedule:
    - cron: '0 */4 * * *' # Elke 4 uur checken
  workflow_dispatch:      # Handmatige knop in GitHub Actions tab

jobs:
  sync_pu_elements:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Versnelt toekomstige runs

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements-fia-sync.txt

      # De Action voert het script uit met de benodigde environment variabelen
      - name: Run FIA Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIA_PU_DELETE_BEFORE_INSERT: "1" # Veiligheidsmarge voor her-runs
        run: python scripts/sync_fia_data.py