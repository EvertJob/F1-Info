# F1 Hub — launcher icons (PNG source only; SVG is rasterized first).
# flutter_launcher_icons uses package:image — it cannot decode SVG.
#
# One-shot:  .\scripts\generate_icons.ps1   |   bash scripts/generate_icons.sh
# (ImageMagick/rsvg-convert if installed, else: flutter test test/tool/rasterize_launcher_logo_test.dart)

flutter_launcher_icons:
  # Standalone config file (use: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml)

  image_path: assets/images/f1_hub_logo_launcher.png

  remove_alpha_ios: true

  # Must match android/app/src/main/AndroidManifest.xml (@mipmap/…)
  android: ic_launcher
  adaptive_icon_background: "#E10600"
  adaptive_icon_foreground: assets/images/f1_hub_logo_launcher.png

  ios: true

  web:
    generate: true
    image_path: assets/images/f1_hub_logo_launcher.png
    background_color: "#E10600"
    theme_color: "#E10600"
